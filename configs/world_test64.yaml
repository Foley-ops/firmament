# Phase 5 acceptance world: 64², warm vent pool, generous prebiotic inventory
# (M1-protocol environment tuning: initial concentrations, not physics).
run:
  name: "phase5-accept"
  seed: 20260911
  dt_seconds: 60
  snapshot_every_sim_days: 25
  metrics_every_ticks: 200
  audit_every_ticks: 1000

world:
  size: [64, 64]
  cell_meters: 1.0
  terrain_seed: 7
  vents: [[16, 32]]
  rotation_period_hours: 24
  year_length_days: 365
  axial_tilt_deg: 23.5
  solar_constant_wm2: 1361
  geothermal_flux_wm2: 0.1
  initial_water_fraction: 0.4

chemistry:
  file: configs/chemistry_v0.yaml
  integer_counts: true
  overrides:
    M1: {init_wet: 3000}
    M2: {init_wet: 3000}
    M3: {init_wet: 3000}
    M4: {init_wet: 3000}
    PP: {init_wet: 20000}
    Pi: {init_wet: 100000}

polymers:
  capacity: 300000
  max_length: 256
  alphabet: [M1, M2, M3, M4]
  mutation_rate_per_monomer: 0.005
  hydrolysis_base_rate: 1e-7
  copy_energy_per_monomer: 1
  genetic_code: configs/genetic_code_v0.yaml

logging:
  level: INFO
  dir: null
