run:
  name: "genesis"
  seed: 20260910
  dt_seconds: 60
  snapshot_every_sim_days: 30
  metrics_every_ticks: 100
  audit_every_ticks: 1000

world:
  size: [256, 256]
  cell_meters: 1.0
  terrain_seed: 7
  vents: [[75, 128], [175, 50]]
  rotation_period_hours: 24
  year_length_days: 365
  axial_tilt_deg: 23.5
  solar_constant_wm2: 1361
  geothermal_flux_wm2: 0.1
  initial_water_fraction: 0.4

chemistry:
  file: configs/chemistry_v0.yaml
  integer_counts: true
  # M1 attempt 1 environment (approved protocol: monomer supply = initial concentrations)
  overrides:
    M1: {init_wet: 3000}
    M2: {init_wet: 3000}
    M3: {init_wet: 3000}
    M4: {init_wet: 3000}
    PP: {init_wet: 20000}
    Pi: {init_wet: 100000}

polymers:
  capacity: 1_000_000
  max_length: 256
  alphabet: [M1, M2, M3, M4]
  mutation_rate_per_monomer: 0.005
  hydrolysis_base_rate: 1e-7
  copy_energy_per_monomer: 1
  genetic_code: configs/genetic_code_v0.yaml

logging:
  level: INFO
  dir: null   # defaults to runs/<run_id>/logs
